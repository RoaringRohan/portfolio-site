name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback so client-side routes work on refresh
      - run: cp build/index.html build/404.html
      # Real 200 responses for known routes: Pages serves /projects from projects.html.
      # A new top-level route in src/App.jsx needs adding to this list.
      - run: |
          for r in work projects about blog hobbies; do cp build/index.html "build/$r.html"; done
          mkdir -p build/blog
          for f in src/content/posts/*.md; do
            [ -e "$f" ] || continue
            slug=$(basename "$f" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-//')
            cp build/index.html "build/blog/$slug.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
